# FILE: .github/workflows/database-backup.yml
# PURPOSE:
# Runs scripts/runBackup.js on GitHub's own cloud runners — entirely
# separate infrastructure from the app's hosting (Vercel) — on a
# nightly schedule during the lowest-traffic window. This is what
# keeps backups fully decoupled from live guest traffic (Rule 40.1):
# nothing here ever touches or slows down a booking request.
#
# Schedule: 18:00 UTC = 2:00 AM Philippine Time (UTC+8) every day.
# Also runs on-demand: either from the Backups page's "Run Backup Now"
# button (app/api/admin/backup-logs/trigger/route.js dispatches this via
# the GitHub API — still decoupled per Rule 40.1, since only the
# dispatch call happens in-app and the actual pg_dump still runs here,
# on GitHub's runners) or by pressing "Run workflow" directly in the
# Actions tab.
name: Nightly Database Backup

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      logId:
        description: "BackupLog row ID pre-created by the app's trigger route (blank when dispatched manually from the Actions tab)"
        required: false
        type: string

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pg_dump ships with the postgresql-client package, not with Node —
      # the Ubuntu runner doesn't have it preinstalled. Ubuntu 24.04's
      # default "postgresql-client" package is version 16, but pg_dump
      # refuses to run against a NEWER server major version ("aborting
      # because of server version mismatch") — and Supabase runs
      # Postgres 17. postgresql-common's pgdg script adds PostgreSQL's
      # own apt repo so we can install postgresql-client-17 specifically,
      # matching (or newer than) whatever Supabase is actually running.
      - name: Install PostgreSQL 17 client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # ubuntu-latest ships with an OLDER postgresql-client
          # preinstalled at /usr/bin/pg_dump — installing version 17
          # alongside it does NOT repoint that symlink, so `pg_dump`
          # on PATH still resolves to the old version unless the v17
          # bin directory is explicitly put first in PATH for the
          # rest of this job (GITHUB_PATH entries are prepended).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # npm ci only installs the @prisma/client package — it does NOT
      # generate the actual client code (.prisma/client/*) that
      # `import { PrismaClient } from "@prisma/client"` resolves to.
      # Without this step the script fails with "Cannot find module
      # '.prisma/client/default'" the moment it tries to instantiate
      # PrismaClient. Only needs DIRECT_URL (session pooler) — see
      # prisma.config.mjs, which is what the CLI reads for generate.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run backup script
        run: npm run backup
        env:
          # schedule event = the 2 AM cron; any workflow_dispatch (the
          # app's "Run Backup Now" button, or someone pressing "Run
          # workflow" directly in GitHub) counts as "manual" — there's
          # no way to tell those two dispatch sources apart from here,
          # and there's no need to: both mean a human wanted a backup
          # right now, as opposed to it happening automatically.
          TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
          # Set only when dispatched from the Backups page's "Run Backup
          # Now" button — that route pre-creates the BackupLog row so it
          # appears on the page instantly, and passes its id here so this
          # script updates that SAME row instead of creating a second,
          # duplicate one. Empty string on the nightly cron and on a
          # manual "Run workflow" click from the Actions tab — the script
          # falls back to creating its own row in both of those cases.
          BACKUP_LOG_ID: ${{ github.event.inputs.logId }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
