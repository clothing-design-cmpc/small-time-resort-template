# FILE: .github/workflows/database-wipe-executor.yml
# PURPOSE:
# Runs scripts/runDatabaseWipe.js on GitHub's own cloud runners — same
# decoupled-from-live-traffic guarantee as database-backup.yml
# (Rule 40.1). Checks for a DatabaseWipeRequest that is both due
# (scheduledAt has passed) and confirmed (finalConfirmedAt is set,
# meaning a super-admin explicitly clicked "Continue" on the blocking
# 2-hour warning modal). Exits immediately, doing nothing, if no
# request currently matches both conditions — the safety gate itself
# lives in scripts/runDatabaseWipe.js, not here.
#
# workflow_dispatch ONLY — no schedule. The app itself is the real
# trigger: app/api/superAdmin/wipe/route.js's GET handler is polled
# every 30 seconds by every authenticated super-admin page, and the
# instant a request goes due+confirmed it calls triggerWorkflowDispatch
# ("database-wipe-executor.yml") directly via the GitHub API — same
# pattern pre-wipe-backup.yml and manual-database-backup.yml already
# use. A 15-minute `schedule:` cron used to sit here as a fallback, but
# at ~55s/run that's ~2,640 GitHub Actions minutes/month spent checking
# a condition that's false well over 99% of the time — most of a
# private repo's whole free-tier monthly quota, burned on a workflow
# with nothing to do. If the app-side dispatch above ever fails (e.g. a
# GitHub API hiccup), the same GET handler simply retries on the very
# next 30-second poll from any open super-admin page — no cron needed
# to catch that case. Also still runnable by hand from the Actions tab
# for manual testing/ops.
name: Database Wipe Executor

on:
  workflow_dispatch: {}

jobs:
  execute-wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Same reasoning as database-backup.yml — pg_dump isn't
      # preinstalled at the version Supabase (Postgres 17) requires.
      - name: Install PostgreSQL 17 client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run wipe executor
        run: npm run wipe-database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
